<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olly 🎙</title>
<style>
:root{--bg:#0b0f14;--panel:#0e1620;--muted:#9aa6b2;--accent:#2196f3;--user:#0b64c7;--olly:#1f2933;--error:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#e6eef6}
.app{max-width:760px;margin:18px auto;padding:12px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.title{font-weight:700;font-size:20px}
.badge{font-size:12px;padding:6px 8px;border-radius:999px;background:#0b1220;color:var(--muted);border:1px solid rgba(255,255,255,0.02)}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.03);padding:16px;border-radius:12px;margin-top:12px}
.thread{height:60vh;overflow:auto;padding:12px;display:flex;flex-direction:column-reverse;gap:8px}
.bubble{max-width:80%;padding:10px;border-radius:12px;box-shadow:0 1px 0 rgba(0,0,0,0.3);}
.user{align-self:flex-end;background:linear-gradient(180deg,#08386b,#0b64c7);color:white;border-bottom-right-radius:4px}
.olly{align-self:flex-start;background:var(--olly);color:#e6eef6;border-bottom-left-radius:4px;display:flex;gap:8px;align-items:center}
.meta{font-size:11px;color:var(--muted);margin-top:6px}
.controls{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px}
#micBtn{width:120px;height:120px;border-radius:999px;background:linear-gradient(180deg,var(--accent),#0b7dd9);border:none;color:white;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,0.6)}
#micBtn.recording{animation: pulse 1s infinite; background:linear-gradient(180deg,#ff4d4d,#ff2b2b)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,0.6)}50%{box-shadow:0 0 0 18px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0.0)}}
.hint{font-size:13px;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:8px}
.btn{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;border:1px solid rgba(255,255,255,0.05);border-bottom:none;cursor:pointer;font-size:14px;background:transparent;color:var(--muted);transition:background .15s}
.tab.active{background:rgba(255,255,255,0.04);color:#e6eef6}
.tab-panel{display:none}.tab-panel.active{display:block}
/* Meeting UI */
.meeting-card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.03);padding:20px;border-radius:0 12px 12px 12px}
.meeting-controls{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0}
#meetBtn{width:120px;height:120px;border-radius:999px;border:none;color:white;font-size:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,0.6);background:linear-gradient(180deg,#27ae60,#1e8449)}
#meetBtn.recording{animation:pulse 1s infinite;background:linear-gradient(180deg,#ff4d4d,#ff2b2b)}
#meetBtn.processing{background:linear-gradient(180deg,#e67e22,#ca6f1e);pointer-events:none}
.meeting-timer{font-size:28px;font-weight:700;letter-spacing:2px;color:#e6eef6;font-variant-numeric:tabular-nums}
.meeting-status{font-size:13px;color:var(--muted)}
.meeting-name-row{display:flex;gap:8px;width:100%;max-width:400px}
#meetingName{flex:1;background:#0e1620;border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:8px 12px;color:#e6eef6;font-size:14px}
.transcript-box{background:#0a0e14;border:1px solid rgba(255,255,255,0.05);border-radius:8px;padding:12px;min-height:200px;max-height:400px;overflow:auto;font-size:13px;line-height:1.7;white-space:pre-wrap;margin-top:12px;color:#c8d8e8}
.transcript-chunk{border-bottom:1px solid rgba(255,255,255,0.03);padding:6px 0}
.transcript-chunk .ts{color:var(--muted);font-size:11px;margin-right:8px}
.transcript-chunk .spk{color:#4a7fa5;font-weight:600;margin-right:6px}
.meeting-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{background:#0e1620;border:1px solid rgba(255,255,255,0.07);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.pill:hover{border-color:var(--accent);color:#e6eef6}
.pill.danger:hover{border-color:var(--error);color:var(--error)}
.info-banner{background:#0a1824;border:1px solid #1a4060;border-radius:8px;padding:12px;font-size:12px;color:#7ab0cc;margin-bottom:12px;line-height:1.6}
.meetings-list{margin-top:12px}
.meeting-item{background:#0e1620;border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.meeting-item:hover{border-color:rgba(255,255,255,0.1)}
.meeting-item .mn{font-size:14px;color:#e6eef6}
.meeting-item .md{font-size:11px;color:var(--muted)}
.smallSpeaker{width:18px;height:18px;border-radius:4px;background:#2b3740;display:inline-block;margin-right:6px}
.group-stream-row{display:flex;align-items:center;gap:10px;width:100%;max-width:400px;margin-top:6px}
.stream-toggle{background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:5px 12px;color:var(--muted);font-size:13px;cursor:pointer;transition:all .15s}
.stream-toggle.active{background:rgba(74,127,165,0.2);border-color:#4a7fa5;color:#4a7fa5}
.chat-selector{background:#0e1620;border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:5px 10px;color:#e6eef6;font-size:13px;display:none}
.agent-checkboxes{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.agent-checkboxes label{display:flex;align-items:center;gap:5px;cursor:pointer}
.agent-checkboxes input[type=checkbox]{accent-color:#4a7fa5}
.stream-status{font-size:11px;color:#4a7fa5;margin-left:4px;display:none}
.recovery-banner{background:rgba(255,200,0,0.08);border:1px solid rgba(255,200,0,0.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#ffd060;display:none}
.recovery-banner button{background:transparent;border:1px solid rgba(255,200,0,0.4);border-radius:5px;padding:3px 10px;color:#ffd060;cursor:pointer;margin-left:8px;font-size:12px}
.thinking{margin-top:8px;font-size:12px;color:var(--muted)}
.thinking summary{cursor:pointer;color:#4a7fa5;user-select:none}
.thinking summary:hover{color:var(--accent)}
.thinking pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;margin:4px 0 0;max-height:200px;overflow:auto;font-family:inherit}
@media (max-width:600px){.card{padding:12px}.thread{height:55vh}.title{font-size:18px}#micBtn{width:96px;height:96px;font-size:30px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand"><div class="title">Olly 🎙</div><div class="badge" id="status">Ready</div></div>
    <div class="topbar">
      <button class="btn" id="newConv">New conversation</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="voice">🎤 Voice</button>
    <button class="tab" data-tab="meeting">📝 Meeting</button>
    <button class="tab" data-tab="saved">📂 Saved</button>
  </div>

  <!-- Voice tab -->
  <div class="tab-panel active" id="tab-voice">
    <div class="card">
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="controls">
        <button id="micBtn" title="Hold Space or click+hold">🎤</button>
        <div class="hint">Hold SPACE to talk</div>
        <div class="engine-row" style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <label for="engineSelect" style="font-size:12px;color:var(--muted)">TTS engine:</label>
          <select id="engineSelect" class="chat-selector" style="display:block;min-width:120px">
            <option value="qwen" selected>Qwen (existing)</option>
            <option value="pocket:english">Pocket TTS · EN</option>
            <option value="pocket:italian">Pocket TTS · IT</option>
            <option value="pocket:italian_24l">Pocket TTS · IT (24l)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Meeting tab -->
  <div class="tab-panel" id="tab-meeting">
    <div class="meeting-card">
      <!-- Recovery banner -->
      <div class="recovery-banner" id="recoveryBanner"></div>
      <div class="info-banner">
        💡 <strong>To record both your mic AND the call audio:</strong> when Chrome asks, choose a browser tab or window and check <em>"Share system audio"</em>. This mixes both streams for full meeting transcription.
      </div>
      <div class="meeting-name-row">
        <input id="meetingName" placeholder="Meeting name (optional)" type="text">
      </div>
      <!-- Group stream -->
      <div class="group-stream-row">
        <button class="stream-toggle" id="streamToggle" onclick="toggleStream()">📡 Live to group</button>
        <select class="chat-selector" id="chatSelector"></select>
        <span class="stream-status" id="streamStatus">● Streaming</span>
      </div>
      <!-- Agent checkboxes -->
      <div class="agent-checkboxes" id="agentCheckboxes" style="display:none">
        <label><input type="checkbox" id="agentLaywy" checked> Lawy</label>
        <label><input type="checkbox" id="agentMarty" checked> Marty</label>
        <label><input type="checkbox" id="agentOlly"> Olly</label>
        <label><input type="checkbox" id="agentSage"> Sage</label>
      </div>
      <div class="meeting-controls">
        <div class="meeting-timer" id="meetTimer">00:00</div>
        <button id="meetBtn">🎙</button>
        <div class="meeting-status" id="meetStatus">Ready to record</div>
      </div>
      <div class="meeting-actions">
        <button class="pill" id="saveBtn" style="display:none">💾 Save transcript</button>
        <button class="pill" id="copyBtn" style="display:none">📋 Copy</button>
        <button class="pill danger" id="clearMeetBtn" style="display:none">🗑 Clear</button>
      </div>
      <div class="transcript-box" id="transcriptBox"><span style="color:#4a5a6a">Transcript will appear here…</span></div>
    </div>
  </div>

  <!-- Saved tab -->
  <div class="tab-panel" id="tab-saved">
    <div class="meeting-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;color:var(--muted)">Past meetings</span>
        <button class="pill" id="refreshSaved">🔄 Refresh</button>
      </div>
      <div class="meetings-list" id="meetingsList"></div>
      <div id="meetingViewer" style="display:none;margin-top:16px">
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="pill" id="closeMeetingViewer">✕ Close</button>
        </div>
        <pre class="transcript-box" id="meetingContent" style="min-height:300px"></pre>
      </div>
    </div>
  </div>
</div>

<script>
const sessionId = 'default';
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const thread = document.getElementById('thread');
const newConvBtn = document.getElementById('newConv');
let mediaStream=null, mediaRecorder=null, chunks=[], audioCtx=null;
let processing=false, spaceDown=false, recordTimeout=null;

function setStatus(s){ statusEl.textContent = s }

async function fetchHealth(){
  try{
    const r = await fetch('/health');
    if(!r.ok) throw new Error('health failed');
    const j = await r.json();
    setStatus((j.llm||'') + ' / ' + (j.whisper||'') + ' / ' + (j.tts||''))
  }catch(e){ setStatus('Error') }
}

function makeBubble(role, text, time, audioUrl, isError, thinking){
  const el = document.createElement('div');
  el.className = 'bubble ' + (isError? 'errorBubble ' : (role==='user'? 'user':'olly'));
  const meta = document.createElement('div'); meta.className='meta'; meta.textContent = (role==='user'? 'You' : 'Olly') + ' · ' + new Date(time).toLocaleTimeString();
  const content = document.createElement('div'); content.innerHTML = text || '<i>(no text)</i>';
  el.appendChild(content);
  if((role==='assistant' || role==='olly') && thinking){
    const details = document.createElement('details');
    details.className='thinking';
    const summary = document.createElement('summary'); summary.textContent='🧠 Thinking…';
    const pre = document.createElement('pre'); pre.textContent=thinking;
    details.appendChild(summary); details.appendChild(pre);
    el.appendChild(details);
  }
  if(role==='assistant' || role==='olly'){
    const row = document.createElement('div'); row.style.display='flex'; row.style.alignItems='center';
    if(audioUrl){
      const speaker = document.createElement('button'); speaker.className='btn'; speaker.style.marginRight='8px'; speaker.textContent='🔊';
      speaker.onclick = async ()=>{ try{ await playUrl(audioUrl) }catch(e){ console.warn(e) } }
      row.appendChild(speaker);
    }
    el.appendChild(row);
  }
  el.appendChild(meta);
  return el;
}

function prependBubble(el){ thread.prepend(el); }

async function playUrl(url){
  setStatus('Speaking');
  try{
    const r = await fetch(url);
    const buf = await r.arrayBuffer();
    await playAudioBuffer(buf);
  }catch(e){ console.warn(e) }
  setStatus('Ready');
}

async function playAudioBuffer(arrayBuffer){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const buf = await audioCtx.decodeAudioData(arrayBuffer);
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination);
    src.start();
    await new Promise(res=> src.onended = res);
  }catch(e){ console.warn('Playback failed', e); }
}

async function startRecording(){
  if(processing) return;
  setStatus('Listening');
  micBtn.classList.add('recording');
  try{
    if(!mediaStream) mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(mediaStream);
    chunks = [];
    mediaRecorder.ondataavailable = e=>chunks.push(e.data);
    mediaRecorder.start();
    // auto-stop at 30s
    recordTimeout = setTimeout(()=> stopRecording(true), 30000);
  }catch(e){ setStatus('Error'); micBtn.classList.remove('recording'); }
}

async function stopRecording(auto=false){
  if(!mediaRecorder) return;
  clearTimeout(recordTimeout);
  micBtn.classList.remove('recording');
  setStatus('Transcribing');
  mediaRecorder.onstop = async ()=>{
    const blob = new Blob(chunks, {type:'audio/webm'}); chunks=[];
    processing=true;
    try{
      const fd = new FormData(); fd.append('file', blob, 'rec.webm');
      const r = await fetch('/transcribe', {method:'POST', body: fd});
      if(!r.ok){
        let msg = 'Transcribe failed';
        try{
          const ej = await r.json();
          if(ej && (ej.error || ej.detail)) msg = ej.error || ej.detail;
        }catch(_){
          msg = `Transcribe failed (${r.status})`;
        }
        throw new Error(msg);
      }
      const jr = await r.json();
      addMessage('user', jr.text || '', null, false);
      setStatus('Thinking');
      // call /chat with session_id (+ selected TTS engine)
      const engine = (document.getElementById('engineSelect')||{}).value || 'qwen';
      const cr = await fetch('/chat', {method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({text: jr.text||'', session_id: sessionId, tts_engine: engine})});
      if(!cr.ok){ const txt = await cr.text(); throw new Error('Chat failed: '+txt); }
      const replyHeader = cr.headers.get('X-Assistant-Reply') || '';
      const thinkingHeader = cr.headers.get('X-Thinking') || '';
      const sess = cr.headers.get('X-Session-Id') || sessionId;
      const audioBuf = await cr.arrayBuffer();
      addMessage('assistant', replyHeader, audioBuf, false, thinkingHeader);
      // play audio but re-enable mic immediately when audio starts
      setStatus('Speaking');
      // create object URL for playback
      const blob2 = new Blob([audioBuf], {type:'audio/wav'});
      const url = URL.createObjectURL(blob2);
      const audio = new Audio(url);
      audio.play();
      audio.onplaying = ()=>{ processing=false; setStatus('Ready'); }
      audio.onended = ()=>{ URL.revokeObjectURL(url); }
    }catch(err){
      console.error(err);
      addMessage('assistant', err.message || 'Error', null, true);
      setStatus('Error');
      processing=false;
    }
  };
  mediaRecorder.stop();
}

function addMessage(role, text, audioBuf, isError, thinking=''){
  const time = Date.now();
  if(audioBuf){
    const blob = new Blob([audioBuf], {type:'audio/wav'});
    const url = URL.createObjectURL(blob);
    const el = makeBubble(role==='assistant'?'olly':role, text, time, url, isError, thinking);
    prependBubble(el);
  }else{
    const el = makeBubble(role==='assistant'?'olly':role, text, time, null, isError, thinking);
    prependBubble(el);
  }
}

// UI bindings
micBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); startRecording(); });
micBtn.addEventListener('pointerup', (e)=>{ e.preventDefault(); stopRecording(); });

window.addEventListener('keydown', (e)=>{ if(e.code==='Space' && !spaceDown){ e.preventDefault(); spaceDown=true; startRecording(); } });
window.addEventListener('keyup', (e)=>{ if(e.code==='Space'){ spaceDown=false; stopRecording(); } });

newConvBtn.addEventListener('click', async ()=>{
  try{ setStatus('Clearing'); await fetch('/history/'+sessionId, {method:'DELETE'}); thread.innerHTML=''; setStatus('Ready'); }catch(e){ setStatus('Error'); }
});

// --- Tab switcher ---
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-'+t.dataset.tab).classList.add('active');
    if(t.dataset.tab==='saved') loadSavedMeetings();
  });
});

// --- Meeting Recorder ---
const meetBtn = document.getElementById('meetBtn');
const meetTimer = document.getElementById('meetTimer');
const meetStatus = document.getElementById('meetStatus');
const transcriptBox = document.getElementById('transcriptBox');
const saveBtn = document.getElementById('saveBtn');
const copyBtn = document.getElementById('copyBtn');
const clearMeetBtn = document.getElementById('clearMeetBtn');

let meetRecorder = null, meetChunks = [], meetStream = null, meetMicStream = null;
let meetInterval = null, meetStartTime = null;
let meetTranscriptLines = [], isRecording = false;
let chunkInterval = null;
let streamEnabled = false;
let activeChatId = '';
let meetSessionId = null;

function formatTime(ms){
  const s = Math.floor(ms/1000), m = Math.floor(s/60);
  return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function appendTranscript(text, ts){
  if(!text.trim()) return;
  const t = ts || new Date().toLocaleTimeString();
  meetTranscriptLines.push(`[${t}] ${text.trim()}`);
  const div = document.createElement('div');
  div.className='transcript-chunk';
  div.innerHTML=`<span class="ts">${t}</span>${text.trim()}`;
  if(transcriptBox.querySelector('span[style]')) transcriptBox.innerHTML='';
  transcriptBox.appendChild(div);
  transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

async function transcribeBlob(blob){
  const fd = new FormData();
  fd.append('file', blob, 'chunk.webm');
  try{
    const r = await fetch('/transcribe',{method:'POST',body:fd});
    if(!r.ok) return '';
    const j = await r.json();
    return j.text || '';
  }catch(e){ return ''; }
}

async function startMeeting(){
  if(isRecording) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    meetStatus.textContent = '⚠️ Not allowed — open via http://localhost:8766/ui/index.html (not via IP)';
    return;
  }
  try{
    meetStatus.textContent = 'Requesting microphone…';
    meetMicStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
    let audioTracks = [...meetMicStream.getAudioTracks()];

    // Try to grab system audio via getDisplayMedia
    try{
      meetStatus.textContent = 'Requesting screen share (check \"Share system audio\")…';
      const displayStream = await navigator.mediaDevices.getDisplayMedia({audio:true, video:{width:1,height:1}});
      const displayAudioTracks = displayStream.getAudioTracks();
      if(displayAudioTracks.length > 0) audioTracks = [...audioTracks, ...displayAudioTracks];
      // Stop video immediately
      displayStream.getVideoTracks().forEach(t=>t.stop());
    }catch(e){
      meetStatus.textContent = 'System audio skipped — mic only';
    }

    // Mix all audio tracks via AudioContext
    const ctx = new AudioContext();
    const dest = ctx.createMediaStreamDestination();
    audioTracks.forEach(track=>{
      const src = ctx.createMediaStreamSource(new MediaStream([track]));
      src.connect(dest);
    });
    meetStream = dest.stream;

    isRecording = true;
    meetStartTime = Date.now();
    meetSessionId = 'meet_' + Date.now();
    meetBtn.textContent = '⏹';
    meetBtn.classList.add('recording');
    meetTranscriptLines = [];
    transcriptBox.innerHTML = '<span style="color:#4a5a6a">Recording…</span>';
    saveBtn.style.display='none'; copyBtn.style.display='none'; clearMeetBtn.style.display='none';

    meetInterval = setInterval(()=>{
      meetTimer.textContent = formatTime(Date.now()-meetStartTime);
    }, 500);

    // Rolling 30s chunks
    function startChunk(){
      if(!isRecording) return;
      meetChunks = [];
      meetRecorder = new MediaRecorder(meetStream);
      meetRecorder.ondataavailable = e=>meetChunks.push(e.data);
      meetRecorder.onstop = async ()=>{
        const blob = new Blob(meetChunks, {type:'audio/webm'});
        const text = await transcribeBlob(blob);
        if(text) {
          appendTranscript(text);
          const ts = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
          streamChunk(text, ts);
          autosaveChunk(text, ts);
        }
        if(isRecording) startChunk();
      };
      meetRecorder.start();
      chunkInterval = setTimeout(()=>{ if(meetRecorder && meetRecorder.state==='recording') meetRecorder.stop(); }, 15000);
    }
    meetStatus.textContent = 'Recording… (chunking every 30s)';
    startChunk();

  }catch(e){
    meetStatus.textContent = 'Error: '+e.message;
    isRecording = false;
  }
}

async function stopMeeting(){
  if(!isRecording) return;
  isRecording = false;
  clearTimeout(chunkInterval);
  clearInterval(meetInterval);
  meetBtn.textContent = '🎙';
  meetBtn.classList.remove('recording');
  meetBtn.classList.add('processing');
  meetStatus.textContent = 'Finalising transcript…';
  if(meetRecorder && meetRecorder.state==='recording') meetRecorder.stop();
  meetMicStream && meetMicStream.getTracks().forEach(t=>t.stop());
  // Wait a moment for last chunk to process
  await new Promise(res=>setTimeout(res, 2000));
  meetBtn.classList.remove('processing');
  meetStatus.textContent = 'Done — '+meetTimer.textContent+' recorded';
  saveBtn.style.display=''; copyBtn.style.display=''; clearMeetBtn.style.display='';
}

meetBtn.addEventListener('click', ()=>{ isRecording ? stopMeeting() : startMeeting(); });

saveBtn.addEventListener('click', async ()=>{
  const name = document.getElementById('meetingName').value || '';
  const duration = meetTimer.textContent;
  const transcript = meetTranscriptLines.join('\n');
  // Collect selected agents
  const agents = [];
  if (document.getElementById('agentLaywy')?.checked) agents.push('lawy');
  if (document.getElementById('agentMarty')?.checked) agents.push('marty');
  if (document.getElementById('agentOlly')?.checked) agents.push('olly');
  if (document.getElementById('agentSage')?.checked) agents.push('sage');
  try{
    const r = await fetch('/meeting/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,duration,transcript,agents:agents.length?agents:['lawy','marty','olly']})});
    const j = await r.json();
    meetStatus.textContent = 'Saved ✓ — reconciling memories…';
    // Clean up autosave after successful save
    if (meetSessionId) {
      const safe = name.replace(/[^a-zA-Z0-9\-_ ]/g, '_').trim().substring(0, 40);
      fetch(`/meeting/autosave/${meetSessionId}_${safe}.md`, {method:'DELETE'}).catch(()=>{});
    }
    setTimeout(()=>{ meetStatus.textContent = 'Saved: '+j.filename; }, 3000);
  }catch(e){ meetStatus.textContent = 'Save failed: '+e.message; }
});

copyBtn.addEventListener('click', ()=>{
  navigator.clipboard.writeText(meetTranscriptLines.join('\n'));
  copyBtn.textContent = '✅ Copied';
  setTimeout(()=>copyBtn.textContent='📋 Copy', 2000);
});

clearMeetBtn.addEventListener('click', ()=>{
  meetTranscriptLines = [];
  transcriptBox.innerHTML = '<span style="color:#4a5a6a">Transcript will appear here…</span>';
  meetTimer.textContent = '00:00';
  meetStatus.textContent = 'Ready to record';
  saveBtn.style.display='none'; copyBtn.style.display='none'; clearMeetBtn.style.display='none';
});

async function loadChats() {
  try {
    const r = await fetch('/chats');
    const j = await r.json();
    const sel = document.getElementById('chatSelector');
    sel.innerHTML = '';
    (j.chats || []).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
    if (j.chats && j.chats.length) {
      activeChatId = j.chats[0].id;
      sel.style.display = 'block';
    }
  } catch(e) { console.warn('loadChats failed', e); }
}

function toggleStream() {
  streamEnabled = !streamEnabled;
  const btn = document.getElementById('streamToggle');
  const boxes = document.getElementById('agentCheckboxes');
  const sel = document.getElementById('chatSelector');
  btn.classList.toggle('active', streamEnabled);
  boxes.style.display = streamEnabled ? 'flex' : 'none';
  if (streamEnabled && !sel.options.length) loadChats();
}

async function streamChunk(text, timestamp) {
  if (!streamEnabled || !activeChatId || !text.trim()) return;
  try {
    await fetch('/meeting/stream-chunk', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, timestamp, chat_id: activeChatId})
    });
    const st = document.getElementById('streamStatus');
    st.style.display = 'inline';
    setTimeout(() => { st.style.display = 'none'; }, 2000);
  } catch(e) { console.warn('streamChunk failed', e); }
}

async function autosaveChunk(text, timestamp) {
  if (!meetSessionId || !text.trim()) return;
  const name = document.getElementById('meetingName').value || 'untitled';
  try {
    await fetch('/meeting/autosave', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: meetSessionId, meeting_name: name, chunk_text: text, timestamp})
    });
  } catch(e) { console.warn('autosave failed', e); }
}

async function checkAutosaves() {
  try {
    const r = await fetch('/meeting/autosaves');
    const j = await r.json();
    if (!j.autosaves || !j.autosaves.length) return;
    const banner = document.getElementById('recoveryBanner');
    const latest = j.autosaves[0];
    const d = new Date(latest.modified * 1000);
    banner.innerHTML = `⚠️ Unsaved meeting found: <strong>${latest.filename.replace(/^[^_]+_/, '').replace('.md','')}</strong> — ${d.toLocaleString()} <button onclick="recoverMeeting('${latest.filename}')">Recover</button><button onclick="discardAutosave('${latest.filename}')">Discard</button>`;
    banner.style.display = 'block';
  } catch(e) {}
}

async function recoverMeeting(filename) {
  const r = await fetch('/meeting/autosave/recover', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({filename})});
  const j = await r.json();
  if (j.status === 'recovered') {
    document.getElementById('recoveryBanner').style.display = 'none';
    alert('Meeting recovered: ' + j.filename);
    loadMeetings();
  }
}

async function discardAutosave(filename) {
  if (!confirm('Discard unsaved meeting?')) return;
  await fetch(`/meeting/autosave/${filename}`, {method:'DELETE'});
  document.getElementById('recoveryBanner').style.display = 'none';
}

// --- Saved meetings ---
async function loadMeetings(){ return loadSavedMeetings(); }
async function loadSavedMeetings(){
  const list = document.getElementById('meetingsList');
  list.innerHTML = '<span style="color:var(--muted);font-size:13px">Loading…</span>';
  try{
    const r = await fetch('/meetings'); const j = await r.json();
    list.innerHTML = '';
    if(!j.meetings.length){ list.innerHTML='<span style="color:var(--muted);font-size:13px">No saved meetings yet.</span>'; return; }
    j.meetings.forEach(m=>{
      const el = document.createElement('div'); el.className='meeting-item';
      const d = new Date(m.modified*1000);
      el.innerHTML=`<span class="mn">${m.filename.replace(/^\d{8}_\d{6}_/,'').replace('.md','')}</span><span class="md">${d.toLocaleString()}</span>`;
      el.addEventListener('click', async ()=>{
        const rv = document.getElementById('meetingViewer');
        const rc = document.getElementById('meetingContent');
        rv.style.display='block';
        const rr = await fetch('/meeting/'+m.filename); const jj = await rr.json();
        rc.textContent = jj.content;
        rv.scrollIntoView({behavior:'smooth'});
      });
      list.appendChild(el);
    });
  }catch(e){ list.innerHTML='<span style="color:var(--error)">Error loading</span>'; }
}

document.getElementById('refreshSaved').addEventListener('click', loadSavedMeetings);
document.getElementById('closeMeetingViewer').addEventListener('click', ()=>{
  document.getElementById('meetingViewer').style.display='none';
});

// On load
fetchHealth();
checkAutosaves();
</script>
</body>
</html>
