version: "3.9"

services:
  ai-server:
    build:
      context: /mnt/d/ai-server-py
      dockerfile: Dockerfile
    container_name: ai-server
    ports:
      - "8005:8005"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - MAX_CACHE_MODELS=2
    restart: unless-stopped

  olly-voice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SKIP_MODEL_DOWNLOAD=0
    container_name: olly-voice
    ports:
      - "8766:8766"
    depends_on:
      - ai-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - LLM_URL=http://ai-server:8005
      - LLM_MODEL=Qwen/Qwen3-0.6B
      - WHISPER_MODEL=base.en
      - WHISPER_DEVICE=cuda
      - TTS_SPEAKER=default
    volumes:
      # Optional: mount pre-downloaded models to skip build-time download
      # - /mnt/c/Users/fabio/.cache/huggingface:/root/.cache/huggingface:ro
      - cosyvoice-models:/app/vendor/CosyVoice/pretrained_models
    restart: unless-stopped

volumes:
  cosyvoice-models:
